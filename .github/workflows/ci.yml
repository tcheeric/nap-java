name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  # Manual runs, so a scan can be re-checked without inventing a commit. The two SCA
  # jobs answer to things outside this repository: Dependency-Check needs the
  # NVD_API_KEY secret and the NVD database behind it, and the OSV job queries a live
  # advisory API. Both can change their answer with the source untouched, and until
  # now the only way to ask again was to push something.
  workflow_dispatch:
  # Nightly, for Dependency-Check specifically. It is excluded from pull requests
  # because a cold NVD build is about 80 minutes, so this is where it actually runs,
  # and where it keeps the cache warm for the next one. 03:17 rather than 03:00 to
  # avoid the top-of-hour crowd that makes scheduled runs queue.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    # Observed around 1 minute. The cap is for a hang, not for slowness: the interop
    # tests spawn a node process, and a child that never exits would otherwise sit on
    # GitHub's 360 minute default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # TypeScriptClientInteropTest spawns the real @imani/nap-client-http package through
      # tsx, so a node toolchain must exist before Maven runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Correctness in this repository is defined relative to the TypeScript reference
      # implementation, and the two tests that assert that (OfficialTestVectorsTest and
      # TypeScriptClientInteropTest) both call JUnit assumeTrue when the sibling `nap`
      # checkout is absent. assumeTrue SKIPS rather than fails, so without this clone the
      # interop suite reports green while asserting nothing, which is precisely the silent
      # regression this CI exists to catch.
      #
      # Cloned into the workspace rather than $HOME: both tests now take an explicit
      # directory property, so the location is chosen here instead of being dictated by a
      # hard-coded home-relative path in test source.
      - name: Check out the TypeScript reference implementation
        run: |
          git clone --depth 1 https://github.com/tcheeric/nap.git "$GITHUB_WORKSPACE/../nap-ts"
          echo "NAP_TS_DIR=$(cd "$GITHUB_WORKSPACE/../nap-ts" && pwd)" >> "$GITHUB_ENV"

      # The interop test looks for node_modules/.bin/tsx inside that checkout. Installing
      # dependencies is what flips the test from skipped to actually executed.
      - name: Install TypeScript client dependencies
        run: npm ci --prefix "$NAP_TS_DIR"

      # A skipped test is indistinguishable from a passing one in a green check, so assert
      # the interop preconditions explicitly and fail loudly when they are missing.
      #
      # Every vector file is checked, not just one. OfficialTestVectorsTest loads three
      # (payload-hash.json, nip98.json, flow.json) and assumeTrue's on each independently,
      # so a checkout missing only one of them would skip that test and still report green.
      - name: Assert the interop toolchain is present
        run: |
          test -x "$NAP_TS_DIR/node_modules/.bin/tsx" \
            || { echo "tsx missing: the interop test would silently skip"; exit 1; }
          for vector in payload-hash.json nip98.json flow.json; do
            test -f "$NAP_TS_DIR/packages/nap-core/test-vectors/$vector" \
              || { echo "test vector $vector missing: that vector test would silently skip"; exit 1; }
          done

      # verify rather than test so the nap-it module runs as part of the reactor.
      # Note: every class in nap-it is named *Test, so surefire runs them all and the
      # configured failsafe plugin currently matches nothing. The interop coverage is real
      # but it arrives through surefire, not failsafe.
      #
      # Both interop directories are passed explicitly. Without them the tests fall back to
      # a home-relative default that does not exist on a runner, and assumeTrue would skip
      # them silently rather than fail.
      - name: Build and test
        run: |
          mvn -B -ntp verify \
            -Dnap.typescript.dir="$NAP_TS_DIR" \
            -Dnap.test-vectors.dir="$NAP_TS_DIR/packages/nap-core/test-vectors"

      # `cache: maven` restores ~/.m2 between runs, so a first-party artifact that ever
      # gets overwritten there persists across builds. Maven checks a checksum when it
      # downloads and never again, and `-C` does not change that: strict checksums apply
      # to transport, not to what is already on disk. Verified, since -C was the first
      # fix proposed for this and it does not work.
      #
      # Today the build runs `verify` rather than `install`, so nothing here writes
      # xyz.tcheeric into the cache and this should always pass. That is the point of
      # running it: the day someone adds an `install`, this is what notices. See #37.
      - name: Check the Maven cache for overwritten releases
        if: always()
        run: python3 check-m2-integrity.py

      # Publish the reports so skip counts stay reviewable rather than hidden behind a check.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    # Observed around 20 seconds. The cap covers the live OSV API failing to answer
    # rather than refusing, which no amount of waiting would improve.
    timeout-minutes: 15
    # The SCA that always runs. Dependency-Check below needs the NVD_API_KEY secret and
    # skips without it, which still covers forks and any clone that does not carry the
    # secret. OSV needs no key and no 12 minute database build, so it is the one scan
    # that cannot be silently disabled by a missing credential.
    #
    # It earns its place rather than duplicating: on the first run it found bcprov 1.84
    # carrying a CRITICAL and a HIGH, and jackson-databind 2.21.4 carrying two MODERATEs.
    # Both arrive transitively through nostr-java-core, so nothing in this repository
    # names them, which is exactly the blind spot an SCA job exists to cover.
    #
    # Blocking, unlike Dependency-Check. A scan that cannot run without a secret must not
    # gate a merge; this one can always run, so it can.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Scanning the resolved tree, not the poms. osv-scanner reads pom.xml directly, but
      # this is a multi-module build whose siblings are not in any registry, so resolution
      # fails per module and it reports "0 packages affected by 0 known vulnerabilities":
      # a green result that scanned nothing. Verified locally before choosing this route.
      # `mvn dependency:tree` resolves against the real BOM, including the overrides in the
      # parent pom, so what gets scanned is what actually ships.
      #
      # -DoutputFile is resolved per module, not once for the reactor, so this writes a
      # deptree.txt into each module directory and leaves the root one holding only the
      # aggregator's own line. The query step globs for all of them rather than reading
      # the root file, which is what it did on the first run: the scan failed closed with
      # "would pass vacuously" instead of reporting a green zero.
      - name: Resolve the dependency tree
        run: mvn -q -B -ntp dependency:tree -DoutputFile=deptree.txt -DappendOutput=true

      - name: Query OSV
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys, urllib.request

          # Third-party runtime and compile dependencies only. The xyz.tcheeric modules are
          # this build's own artifacts and exist in no advisory database.
          packages = {}
          trees = sorted(pathlib.Path('.').glob('**/deptree.txt'))
          print(f'Reading {len(trees)} dependency tree file(s): '
                + ', '.join(str(t) for t in trees))
          for tree in trees:
              for line in tree.read_text().splitlines():
                  match = re.search(r'([\w.\-]+):([\w.\-]+):jar:([\w.\-]+):(compile|runtime)', line)
                  if match:
                      group, artifact, version, _ = match.groups()
                      if not group.startswith('xyz.tcheeric'):
                          packages[f'{group}:{artifact}'] = version

          if not packages:
              sys.exit('No packages parsed from any deptree.txt: the scan would pass vacuously.')

          ordered = sorted(packages.items())
          payload = json.dumps({'queries': [
              {'package': {'name': name, 'ecosystem': 'Maven'}, 'version': version}
              for name, version in ordered
          ]}).encode()

          request = urllib.request.Request('https://api.osv.dev/v1/querybatch', data=payload)
          results = json.load(urllib.request.urlopen(request, timeout=120))['results']

          findings = []
          for (name, version), result in zip(ordered, results):
              ids = [v['id'] for v in (result.get('vulns') or [])]
              if ids:
                  findings.append(f'{name}@{version}: {", ".join(ids)}')

          print(f'Scanned {len(ordered)} third-party packages.')
          for finding in findings:
              print(f'::error title=Known vulnerability::{finding}')

          if findings:
              sys.exit(f'{len(findings)} package(s) with known advisories.')
          print('No known advisories.')
          PY

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # Not on pull requests. The NVD API returns roughly 5,000 records per minute even
    # with a key, and the database is 397,360 records, so a cold build is about 80
    # minutes: measured here, not estimated, from the first run that had a key. Paying
    # that on a pull request is unreasonable, and the cache does not rescue it, because
    # the first run to populate the cache still has to do the full download before the
    # cache step can save anything.
    #
    # So it runs on a schedule and on demand, where 80 minutes is acceptable and where
    # each run also refreshes the cache that makes the next one quick. Pull requests are
    # covered by osv-scan, which answers the same question in 20 seconds without a key.
    # A nightly scan is the right cadence anyway: advisories appear against dependencies
    # that have not changed, so the interesting result arrives without a commit.
    if: github.event_name != 'pull_request'
    #
    # Secondary to osv-scan above, which is the gate. The NVD_API_KEY secret was added on
    # 2026-09-24, so this job now performs a real scan here rather than skipping, but it
    # still skips on a fork or any clone without the secret. Reporting rather than
    # blocking keeps that difference from turning into a red check about a credential.
    #
    # An earlier note here claimed 14 findings in spring-core and spring-security-core.
    # That was not reproducible and was retracted. A later note claimed the tree "currently
    # scans clean", which was also wrong, just less visibly: this job had never run on a
    # runner, and OSV found four advisories the moment anything actually scanned. Two of
    # them, bcprov 1.84, were CRITICAL and HIGH. Both claims came from a local run against
    # a populated database, which is a weaker check than it looks.
    #
    # Given that history, it stays non-blocking until it has run green on a runner with
    # the key a few times. Promoting it before then would be trusting a third claim of
    # the same shape as the two that were wrong.
    continue-on-error: true
    # Sized for the cold build plus headroom, rather than GitHub's 360 minute default.
    # With continue-on-error, an unbounded wedged scan would quietly burn six hours per
    # trigger while reporting nothing.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Building the NVD database from scratch is about 80 minutes on a runner: 397,360
      # records at roughly 5,000 per minute, measured on the first run that had an API
      # key. It took 12 minutes on a warm developer machine, which is the figure this
      # comment used to quote and which badly understated the cost here.
      #
      # So this cache is what makes the job viable rather than merely quicker. The key
      # rolls per run so each run writes a fresh copy, and restore-keys lets it start
      # from the previous database and apply only the delta.
      # Split restore and save rather than the combined actions/cache. The combined
      # action saves in a post step that is skipped when the job fails, and this job
      # fails whenever the scan finds something at or above the CVSS gate, which is its
      # normal outcome rather than an error. So the 80 minute download was discarded
      # every run and every run started cold: observed twice, 40 download-progress lines
      # on a run that should have restored a database built an hour earlier.
      #
      # `save-always: true` on the combined action looks like the fix and is not. The
      # action documents it as deprecated, "does not work as intended", and names this
      # split as the supported approach.
      - name: Restore the NVD database
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # The dependency tree is managed by imani-bom, so transitive CVEs arrive without any
      # visible version bump in this repository. Jackson matters directly: Nip98Validator
      # and DefaultNapServer parse attacker-controlled JSON on the unauthenticated path.
      #
      # CVSS >= 7 is the opening gate. A scanner developers learn to ignore has negative
      # value, so tighten only once the baseline is known clean.
      #
      # An NVD API key is required, not merely an optimisation. An earlier version of this
      # comment claimed a missing key meant "slow rather than broken"; the first run on a
      # runner disproved that, failing in 52s with "Invalid API Key, length of 0 too short".
      # Reproduced locally against an empty data directory: the keyless run fails the same
      # way whether NVD_API_KEY is empty or entirely unset, so it is the absent key rather
      # than the empty string that breaks it. The message is misleading, since it describes
      # key masking rather than the rejected request underneath. The legacy 1.1 JSON feeds
      # are not a way around it either: nvd.nist.gov now answers those with 403.
      #
      # So the job skips with an explanation instead of failing red on every PR until the
      # secret exists. A permanently red check that everyone knows to ignore trains people
      # to ignore the scanner, which is worse than not running it. Get a free key at
      # https://nvd.nist.gov/developers/request-an-api-key and add it as the NVD_API_KEY
      # repository secret, and this becomes a real scan on the next run.
      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            # `install` before the goal, not the goal on its own. Invoking
            # dependency-check-maven:check directly runs it per module without building
            # anything, so module 2 onwards tries to resolve xyz.tcheeric:nap-core:0.9.0
            # from the repositories and fails: this version is not published yet, and a
            # release under development never is. Attaching the goal to a lifecycle run
            # puts each module's own jar in the local repository before its dependents
            # need it.
            #
            # This hid behind the NVD problem. Every earlier run died during the database
            # update, on module 1, so nothing ever reached module 2 to discover it. The
            # first run that got a working key spent 50 minutes downloading and then
            # failed here.
            #
            # -DskipTests because `build` already ran the suite; this job wants the
            # artifacts, not a second test run.
            #
            # The install goes to a repository private to this job, not to the cached
            # ~/.m2. `cache: maven` persists that directory across runs, so installing
            # 0.9.0 into it would leave a locally built copy of a release coordinate
            # sitting in a shared cache: precisely the hazard #37 covers, where a build
            # overwrites a published artifact and nothing notices.
            #
            # dataDirectory has to be named explicitly alongside it. The NVD database
            # defaults to a path inside the local repository, so moving the repository
            # would move the database out from under the cache above and buy an 80 minute
            # rebuild every night. Pointing it back at the cached location keeps the two
            # decisions independent: artifacts isolated, database shared.
            mvn -B -ntp \
              -Dmaven.repo.local="$RUNNER_TEMP/dc-repo" \
              -DdataDirectory="$HOME/.m2/repository/org/owasp/dependency-check-data" \
              install org.owasp:dependency-check-maven:check \
              -DskipTests -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY"
          else
            echo "::warning title=Dependency-Check skipped::NVD_API_KEY secret is not set, so the NVD database cannot be built and no scan ran. Add the secret (free key: https://nvd.nist.gov/developers/request-an-api-key) to enable this job."
            echo "Skipping the scan: without an API key the NVD update fails outright rather"
            echo "than running slowly, so there is nothing to scan against."
          fi

      # The other half of the split cache. `always()` is the entire point: the scan step
      # above exits non-zero whenever it finds something at or above the gate, and that
      # is the outcome this job exists to produce. Saving only on success would keep
      # discarding the database on exactly the runs that matter.
      #
      # No cache-hit guard, because the key embeds github.run_id and so can never match
      # an existing entry: the restore always lands through restore-keys as a partial
      # hit, and this always writes a fresh entry. That is deliberate rather than
      # wasteful. The database is updated in place by each run, so the new entry holds
      # the previous database plus today's delta, and the next run starts from it.
      - name: Save the NVD database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'
          if-no-files-found: warn
